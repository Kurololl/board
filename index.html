<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Board</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage">
  <div id="world"></div>
  <canvas id="canvas"></canvas>
  <svg id="links" width="1" height="1"></svg>
  <div id="cursors"></div>
</div>

<div id="pinbar" hidden>
  <div id="pbSwatches" data-k="note folder link"></div>
  <input type="color" id="pbCustom" data-k="note folder link" title="Custom color">
  <span class="sep" data-k="note folder"></span>
  <button id="pbSmaller" data-k="note folder image" title="Smaller text">A−</button>
  <span id="pbSize" data-k="note folder image"></span>
  <button id="pbBigger" data-k="note folder image" title="Bigger text">A+</button>
  <button id="pbBold" data-k="note folder image" title="Bold (Ctrl+B)"><b>B</b></button>
  <label class="pb-textcolor" data-k="note folder image" title="Text color">A<input type="color" id="pbTextColor"></label>
  <span class="sep" data-k="note folder image"></span>
  <button id="pbConnect" data-k="note folder image" title="Connect to another pin">🧵</button>
  <button id="pbDelete" title="Delete (Del)">🗑️</button>
</div>

<nav id="crumbs"></nav>

<div id="status">
  <span class="dot"></span>
  <span id="statusText">Loading…</span>
  <input id="name" class="live-only" maxlength="24" spellcheck="false" title="Your name shown to others">
  <button id="openSettings" class="not-live" title="GitHub settings">⚙️</button>
</div>

<div id="toolbar">
  <button data-tool="select" title="Select and move (V)">✋</button>
  <button data-tool="pen" class="edit-only" title="Pen (P)">✏️</button>
  <button data-tool="eraser" class="edit-only" title="Eraser (E)">🧽</button>
  <button data-tool="connect" class="edit-only" title="Connect pins: drag from one pin to another (C)">🧵</button>
  <span class="sep edit-only"></span>
  <input type="color" id="color" class="edit-only" value="#222222" title="Color">
  <input type="range" id="width" class="edit-only" min="1" max="40" value="4" title="Brush size">
  <span class="sep edit-only"></span>
  <button id="addNote" class="edit-only" title="Add note (N)">📝</button>
  <button id="addFolder" class="edit-only" title="Add folder (F)">📁</button>
  <button id="addImage" class="edit-only" title="Add image (I)">🖼️</button>
  <span class="sep edit-only"></span>
  <button id="undo" class="edit-only" title="Undo (Ctrl+Z)">↩️</button>
  <button id="share" title="Copy link to this board">🔗</button>
  <input type="file" id="fileInput" accept="image/*" multiple hidden>
</div>

<dialog id="settings">
  <form method="dialog">
    <h3>GitHub storage</h3>
    <label>Owner<input name="owner" autocomplete="off" spellcheck="false"></label>
    <label>Repository<input name="repo" autocomplete="off" spellcheck="false"></label>
    <label>Data branch<input name="branch" autocomplete="off" spellcheck="false"></label>
    <label>Access token<input name="token" type="password" autocomplete="off" placeholder="github_pat_…"></label>
    <p class="hint">Use a fine-grained token with access to this repository only and the permission "Contents: Read and write". It is stored in this browser only. Without a token the board is read-only.</p>
    <div class="row">
      <button value="disconnect" class="ghost">Disconnect</button>
      <span></span>
      <button value="cancel">Cancel</button>
      <button value="save" class="primary">Save</button>
    </div>
  </form>
</dialog>

<div id="toast"></div>
<div id="dropHint">Drop images here</div>

<script type="module" src="app.js"></script>
</body>
</html>
